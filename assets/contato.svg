<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t">
<title id="t">Offline, disponível, online. Toda boa ideia precisa de um respiro com propósito.</title>
<defs>
  <filter id="glow" x="-10%" y="-60%" width="120%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="a"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-10%" y="-60%" width="120%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" fill="#000" opacity=".55"/></pattern>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/>
  </radialGradient>
  <radialGradient id="phos" cx="50%" cy="40%" r="70%">
