  </radialGradient>
  <clipPath id="frame"><rect width="1200" height="330" rx="14"/></clipPath>
  <style>
    .flick{animation:flick 6s steps(1) infinite}
    @keyframes flick{0%,100%{opacity:1}47%{opacity:.94}48%{opacity:1}83%{opacity:.97}84%{opacity:1}}
    .blink{animation:blink 1.05s steps(1) infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .cover{transform-box:fill-box;transform-origin:right;animation-name:type;animation-fill-mode:both}
    @keyframes type{from{transform:scaleX(1);opacity:1}99%{opacity:1}to{transform:scaleX(0);opacity:0}}
    .show{animation:show .01s linear both}
    @keyframes show{from{opacity:0}to{opacity:1}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 3.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.cover{display:none}}</style>
</defs>
