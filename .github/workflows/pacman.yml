name: pacman

on:
  schedule:
    - cron: '0 3 * * *'   # todo dia, meia-noite no horário de Brasília
  workflow_dispatch:       # botão "Run workflow" pra rodar na hora
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: gerar o Pac-Man das contribuições
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: publicar os SVGs no branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
